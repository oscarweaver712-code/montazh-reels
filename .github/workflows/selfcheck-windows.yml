# Установка и самопроверка на чистой Windows: проект обязан работать и на Mac, и на Windows
# (11.10.2026), а Windows-машины под рукой нет. GitHub поднимает её сам на каждый push в main.
# Всё как у человека: папка «Монтаж Reels» (кириллица и пробел), Git с настройками установщика
# по умолчанию (без права на symlink, CRLF), кэш моделей с кириллицей в пути (имя пользователя),
# запуск — Установка.bat. Отличие одно: системные
# программы ставит не winget (его на машинах GitHub нет), а choco и actions.
name: Самопроверка на Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # кэш моделей — по пути с кириллицей, как у пользователя Windows с русским именем
      HF_HOME: D:\a\Кэш моделей\huggingface
      EASYOCR_MODULE_PATH: D:\a\Кэш моделей\EasyOCR
    steps:
      - name: Git как у человека на Windows
        run: |
          git config --global core.symlinks false
          git config --global core.autocrlf true

      - uses: actions/checkout@v7.0.1
        with:
          path: Монтаж Reels

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - uses: astral-sh/setup-uv@v10.3.0

      - name: ffmpeg (полная сборка, с libass)
        run: choco install ffmpeg-full -y --no-progress

      - name: Установка.bat (в конце — самопроверка)
        working-directory: Монтаж Reels
        run: |
          cmd /c "Установка.bat < NUL"
          exit $LASTEXITCODE

      - name: После установки и самопроверки в git ничего не изменилось
        working-directory: Монтаж Reels
        run: |
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) { $dirty; exit 1 }
          Write-Host "чисто"
