    <style>

      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-ExtraBold.ttf"); font-weight: 800; }
      @font-face { font-family: "Cormorant"; src: url("assets/fonts/CormorantGaramond.ttf"); font-weight: 300 700; }
      @font-face { font-family: "Cormorant"; src: url("assets/fonts/CormorantGaramond-Italic.ttf"); font-weight: 300 700; font-style: italic; }

      :root {
        --cream: #F2EBDD;
        --red: #F0352C;
        --ink: #141210;
        --paper: #F1E9D8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Manrope", sans-serif; }

      /* камера: две обёртки с одинаковым движением — фон и вырезанный человек */
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cam-fg { opacity: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* всё графическое скрыто, пока таймлайн не покажет */
      .g { position: absolute; opacity: 0; }

      /* подменённый фон: картина XVI века */
      #plate { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; opacity: 0; }
      #plate-img { position: absolute; left: -200px; top: 0; width: 1480px; height: 1920px; object-fit: cover; object-position: 52% 50%;
                   filter: sepia(0.45) saturate(0.85) brightness(0.58) contrast(1.08); }
      #plate-vignette { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
                        background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.75) 100%); }

      /* крупная типографика за спиной */
      .big { left: 0; width: 1080px; text-align: center; font-family: "Oswald"; font-weight: 700; text-transform: uppercase;
             color: var(--cream); line-height: 0.92; letter-spacing: -0.01em; text-shadow: 0 12px 40px rgba(0,0,0,0.35); }
      .red { color: var(--red); }
      .lead { left: 0; width: 1080px; text-align: center; font-family: "Manrope"; font-weight: 800; font-size: 34px;
              letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream); text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
      .serif { font-family: "Cormorant"; font-weight: 700; }
      #aeq-full span { display: inline-block; }
      .bar { height: 118px; border-radius: 8px; background: var(--cream); box-shadow: 0 18px 50px rgba(0,0,0,0.45); }

      /* бегущие субтитры: по слову-два на уровне груди, как в референсах */
      .cap { position: absolute; left: 60px; width: 960px; top: 1150px; text-align: center; opacity: 0;
             font-family: "Manrope"; font-weight: 800; font-size: 58px; line-height: 1.1; color: var(--cream);
             text-shadow: 0 2px 4px rgba(0,0,0,0.55), 0 6px 24px rgba(0,0,0,0.5); }

      .card-sub { font-family: "Cormorant"; font-style: italic; font-weight: 600; font-size: 27px; color: #5A4E3C; }
      .card-right { left: 744px; top: 150px; }
      .card-left { left: 36px; top: 150px; }

      /* штампы и стикеры */

               border: 6px solid var(--red); border-radius: 10px; padding: 2px 18px; letter-spacing: 0.04em; }
      .sticker { font-family: "Cormorant"; font-style: italic; font-weight: 700; color: var(--ink); background: var(--cream);

      .pill { font-family: "Manrope"; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cream);

      /* документы снизу: страницы книги, формулы, бланк */

                 font-size: 30px; color: #4A3F30; }
      .formula { font-family: "Cormorant"; font-weight: 600; font-size: 70px; color: var(--ink); text-align: center; line-height: 1.25;
                  font-variant-numeric: lining-nums; }
      .formula.small { font-size: 56px; }
      .formula sub { font-size: 0.55em; }

      .censor { left: 280px; top: 230px; width: 520px; height: 150px; border-radius: 18px; background: #0C0C0D;
                display: flex; align-items: center; justify-content: center; gap: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
      .censor span { font-family: "Oswald"; font-weight: 700; font-size: 86px; letter-spacing: 0.08em; color: var(--cream); }
      .censor b { font-family: "Manrope"; font-weight: 800; font-size: 34px; color: #fff; background: var(--red);
                  width: 84px; height: 84px; border-radius: 42px; display: flex; align-items: center; justify-content: center; }

      .rows { left: 40px; width: 1000px; text-align: center; font-family: "Cormorant"; font-style: italic; font-weight: 600;
              font-size: 50px; color: rgba(242,235,221,0.62); }

      .ege { padding: 26px 30px 30px; background: #FBFBF8; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
      .ege-head { font-family: "Manrope"; font-weight: 800; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: #2B3A67; }
      .ege-row { margin-top: 18px; display: flex; align-items: center; gap: 22px; }
      .ege-label { font-family: "Manrope"; font-weight: 800; font-size: 34px; color: var(--ink); }
      .cells { display: flex; }

                 justify-content: center; font-family: "Cormorant"; font-style: italic; font-weight: 700; font-size: 76px; color: #1F3FA8;
                 font-variant-numeric: lining-nums; }

      #flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; }
      .cta { padding: 34px 40px 40px; border-radius: 34px; background: rgba(12,12,14,0.86); border: 2px solid rgba(242,235,221,0.16);
             box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
      .cta-big { font-family: "Oswald"; font-weight: 700; font-size: 104px; line-height: 0.95; text-transform: uppercase; color: var(--cream); }
      .cta-small { margin-top: 14px; font-family: "Manrope"; font-weight: 800; font-size: 40px; color: rgba(242,235,221,0.85); }
          #plate { -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 50%, transparent 68%);
               mask-image: linear-gradient(to bottom, #000 0%, #000 50%, transparent 68%); }
      .eq-line { left: 0; width: 1080px; text-align: center; font-family: "Cormorant"; font-style: italic; font-weight: 700;
                 font-size: 110px; color: var(--cream); font-variant-numeric: lining-nums; text-shadow: 0 6px 30px rgba(0,0,0,0.45); }
      .letter { top: 150px; width: 230px; text-align: center; font-family: "Oswald"; font-weight: 700; font-size: 300px;
                line-height: 0.95; color: var(--cream); text-shadow: 0 12px 40px rgba(0,0,0,0.35); }
      .tale { left: 0; width: 1080px; text-align: center; font-family: "Cormorant"; font-weight: 700; color: var(--cream);
              line-height: 0.95; text-shadow: 0 6px 30px rgba(0,0,0,0.7); }
      #scan { position: absolute; left: 0; top: 0; width: 100%; height: 90px; opacity: 0;
              background: linear-gradient(180deg, rgba(90,220,255,0) 0%, rgba(90,220,255,0.55) 50%, rgba(90,220,255,0) 100%); }
      .diamond { width: 150px; height: 150px; }
      @font-face { font-family: "JBMono"; src: url("assets/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
      .mono { font-family: "JBMono"; font-weight: 700; }
      .glyph { text-align: center; line-height: 1; color: var(--cream); text-shadow: 0 12px 40px rgba(0,0,0,0.4); }
      .dot { width: 150px; height: 150px; border-radius: 75px; background: var(--red); box-shadow: 0 16px 50px rgba(0,0,0,0.45); }
      .label { font-family: "Manrope"; font-weight: 800; font-size: 32px; letter-spacing: 0.2em; text-transform: uppercase;
               color: var(--cream); text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
      .notebook { padding: 30px 40px 26px; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); background-color: #FBFBF6;
                  background-image: linear-gradient(#C9DBF2 2px, transparent 2px), linear-gradient(90deg, #C9DBF2 2px, transparent 2px);
                  background-size: 44px 44px; }
      .legal { padding: 30px 40px 26px 90px; border-radius: 8px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); background-color: #FFF4AE;

      .hand { font-family: "Cormorant"; font-style: italic; font-weight: 700; font-size: 120px; color: #1F3FA8;
              font-variant-numeric: lining-nums; line-height: 1.1; }
      .note { font-family: "Manrope"; font-weight: 800; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; color: #5B6B86; }
      .code { padding: 34px 40px; border-radius: 18px; background: #16181D; border: 2px solid #2A2E37; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
              font-family: "JBMono"; font-weight: 600; font-size: 54px; color: #E6E6E6; }
      .code .k { color: #FF7AB6; } .code .n { color: #9CDCFE; } .code .v { color: #F7C873; } .code .s { color: #F0352C; }
      .code .c { color: #6B7385; font-size: 34px; }
      .keys { display: flex; gap: 34px; }
      .key { position: relative; width: 170px; height: 170px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
             background: linear-gradient(180deg, #F7F7F4, #D6D6D0); box-shadow: 0 10px 0 #A9A9A2, 0 26px 50px rgba(0,0,0,0.55);
             font-family: "JBMono"; font-weight: 700; font-size: 104px; color: #23252B; }
      .key .no { position: absolute; left: 18px; top: 80px; width: 134px; height: 12px; border-radius: 6px; background: var(--red); }
      .key-glow { position: absolute; left: -16px; top: -16px; width: 202px; height: 202px; border-radius: 34px; border: 6px solid #4FE3E6; }
      .paper { padding: 34px 44px 30px; border-radius: 8px; background: #F3EAD6; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
      .paper-text { font-family: "Cormorant"; font-style: italic; font-weight: 600; font-size: 52px; line-height: 1.2; color: #2A2219; }
      .paper-sign { margin-top: 14px; text-align: right; font-family: "Cormorant"; font-weight: 700; font-size: 34px; color: #6A5A44; }
      .xs { font-family: "Cormorant"; font-style: italic; font-weight: 700; font-size: 96px; color: var(--cream); line-height: 1; }
      /* системные шрифты macOS: через @font-face с local(), иначе lint HyperFrames (--strict) не пустит в рендер */
      @font-face { font-family: "Geeza Pro"; src: local("Geeza Pro Bold"), local("GeezaPro-Bold"); font-weight: 700; }
      @font-face { font-family: "Kohinoor Devanagari"; src: local("Kohinoor Devanagari Bold"), local("KohinoorDevanagari-Bold"); font-weight: 700; }
      .arab { font-family: "Geeza Pro", serif; font-weight: 700; text-transform: none; }
      .deva { font-family: "Kohinoor Devanagari", sans-serif; font-weight: 700; text-transform: none; }
      .chain { position: absolute; top: 120px; height: 200px; text-align: center; color: var(--cream); line-height: 1;
               text-shadow: 0 10px 36px rgba(0,0,0,0.45); }

    </style>
  </head>

        <div id="cta" class="g cta" style="left: 90px; top: 1130px; width: 900px;">
          <div class="cta-big">Больше математики</div>
          <div class="cta-small">радикально подготовлю к ЕГЭ</div>
        </div>
        <svg id="cta-arrow" class="g" viewBox="0 0 220 200" style="left: 70px; top: 1470px; width: 220px; height: 200px;">
          <path id="arrow-path" d="M 190 20 C 150 90, 110 130, 40 160" fill="none" stroke="#F2EBDD" stroke-width="12"
                stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
          <path id="arrow-head" d="M 40 160 L 92 168 M 40 160 L 66 116" fill="none" stroke="#F2EBDD" stroke-width="12" stroke-linecap="round" />
        </svg>
        <div id="flash"></div>
      </div>
      <audio id="sfx-root" src="assets/sfx/impact-bass-1.mp3" data-start="0.67" data-volume="0.42"></audio>
      <audio id="sfx-sprout" src="assets/sfx/sparkle.mp3" data-start="3.11" data-volume="0.26"></audio>
      <audio id="sfx-roots" src="assets/sfx/whoosh-short.mp3" data-start="4.17" data-volume="0.22"></audio>
      <audio id="sfx-smoke" src="assets/sfx/pop.mp3" data-start="8.35" data-volume="0.26"></audio>
      <audio id="sfx-sq" src="assets/sfx/whoosh-short.mp3" data-start="9.39" data-volume="0.24"></audio>
      <audio id="sfx-cells" src="assets/sfx/click-soft.mp3" data-start="12.91" data-volume="0.36"></audio>
      <audio id="sfx-three" src="assets/sfx/click.mp3" data-start="14.91" data-volume="0.32"></audio>
      <audio id="sfx-side" src="assets/sfx/pop.mp3" data-start="16.15" data-volume="0.28"></audio>
      <audio id="sfx-grow" src="assets/sfx/whoosh.mp3" data-start="18.57" data-volume="0.26"></audio>
      <audio id="sfx-sqroots" src="assets/sfx/whoosh-short.mp3" data-start="19.91" data-volume="0.22"></audio>
      <audio id="sfx-koren" src="assets/sfx/impact-bass-1.mp3" data-start="21.43" data-volume="0.40"></audio>
      <audio id="sfx-ch1" src="assets/sfx/click.mp3" data-start="23.67" data-volume="0.34"></audio>
      <audio id="sfx-ch2" src="assets/sfx/click.mp3" data-start="26.41" data-volume="0.34"></audio>
      <audio id="sfx-ch3" src="assets/sfx/click.mp3" data-start="27.93" data-volume="0.34"></audio>
      <audio id="sfx-xvi" src="assets/sfx/impact-bass-1.mp3" data-start="29.89" data-volume="0.32"></audio>
      <audio id="sfx-r" src="assets/sfx/pop.mp3" data-start="32.33" data-volume="0.28"></audio>
      <audio id="sfx-rroot" src="assets/sfx/ping.mp3" data-start="32.75" data-volume="0.28"></audio>
      <audio id="sfx-radv" src="assets/sfx/whoosh-short.mp3" data-start="35.04" data-volume="0.24"></audio>
      <audio id="sfx-bar" src="assets/sfx/click.mp3" data-start="35.62" data-volume="0.36"></audio>
      <audio id="sfx-desc" src="assets/sfx/whoosh-short.mp3" data-start="36.46" data-volume="0.28"></audio>
      <audio id="sfx-wall" src="assets/sfx/pop.mp3" data-start="37.40" data-volume="0.26"></audio>
      <audio id="sfx-x1" src="assets/sfx/pop.mp3" data-start="39.78" data-volume="0.28"></audio>
      <audio id="sfx-brad" src="assets/sfx/impact-bass-1.mp3" data-start="44.58" data-volume="0.36"></audio>
      <audio id="sfx-msk" src="assets/sfx/pop.mp3" data-start="48.56" data-volume="0.28"></audio>
      <audio id="sfx-cta" src="assets/sfx/pop.mp3" data-start="50.52" data-volume="0.40"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = window.CAMERA, step = 1 / window.CAMERA_FPS;
      tl.set(".cam", { transformOrigin: "0 0", x: cam[0][0], y: cam[0][1], scale: cam[0][2] }, 0);
      tl.to(".cam", {
        keyframes: cam.slice(1).map(([x, y, s]) => ({ x, y, scale: s, duration: step, ease: "none" })),
      }, 0);
      [[0.59, 2.22], [21.35, 22.42], [23.15, 29.22], [29.07, 31.32], [44.50, 46.25]]
        .forEach(([a, b]) => { tl.set("#cam-fg", { opacity: 1 }, a); tl.set("#cam-fg", { opacity: 0 }, b); });

      // ---------- словарь движения: всё входит И выходит движением, а не растворением ----------
      const BLUR = (px) => `blur(${px}px)`;

      // влёт со смазом: элемент прилетает размытым и встаёт в фокус
      function enter(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 0.7, x: o.fromX ?? 0, y: o.fromY ?? 0, filter: BLUR(o.blur ?? 12) };
        const to = { opacity: 1, scale: 1, x: 0, y: 0, filter: BLUR(0), duration: o.dur ?? 0.32, ease: o.ease ?? "back.out(1.7)" };
        if (o.rot !== undefined || o.fromRot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot ?? 0; }
        tl.fromTo(sel, from, to, t);
      }
      // уход: улетает, сжимается и смазывается
      function leave(sel, t, o = {}) {
        const to = { opacity: 0, scale: o.scale ?? 0.82, x: o.x ?? 0, y: o.y ?? -40, filter: BLUR(o.blur ?? 12),
                     duration: o.dur ?? 0.24, ease: o.ease ?? "power2.in" };
        if (o.rot !== undefined) to.rotation = o.rot;
        tl.to(sel, to, t);
      }
      // «впечатывание»: крупное слово или штамп бьёт в кадр с размаха
      function slam(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 1.45, filter: BLUR(o.blur ?? 16) };
        const to = { opacity: 1, scale: 1, filter: BLUR(0), duration: o.dur ?? 0.16, ease: "power4.out" };
        if (o.rot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot; }
        tl.fromTo(sel, from, to, t);
      }
      function draw(sel, t, dur = 0.4) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      }
      // портрет: вылет сбоку с поворотом, медленный наезд внутри картинки, улёт обратно
      function card(sel, tIn, tOut, side) {
        const s = side === "right" ? 1 : -1;
        tl.fromTo(sel, { opacity: 0, x: 460 * s, rotation: 16 * s, filter: BLUR(14) },
                  { opacity: 1, x: 0, rotation: 4 * s, filter: BLUR(0), duration: 0.45, ease: "power3.out" }, tIn);
        tl.fromTo(`${sel} img`, { scale: 1 }, { scale: 1.12, duration: tOut - tIn + 0.3, ease: "none" }, tIn);
        tl.to(sel, { opacity: 0, x: 460 * s, rotation: 18 * s, filter: BLUR(14), duration: 0.32, ease: "power2.in" }, tOut);
      }
      // документ снизу: выезжает с поворотом и уезжает вниз
      function doc(sel, tIn, tOut, o = {}) {
        tl.fromTo(sel, { opacity: 0, y: 560, rotation: o.fromRot ?? 7, filter: BLUR(12) },
                  { opacity: 1, y: 0, rotation: o.rot ?? -2, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, tIn);
        if (tOut !== null) {
          tl.to(sel, { opacity: 0, y: 520, rotation: (o.rot ?? -2) - 8, filter: BLUR(12), duration: 0.32, ease: "power2.in" }, tOut);
        }
      }
      // белая вспышка на главном ударе
      let flashes = 0;
      function flash(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.38, duration: 0.04, ease: "none", immediateRender: flashes++ === 0 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, t + 0.04);
      }
      function bars(sel, t, stagger = 0.06) {
        tl.fromTo(sel, { opacity: 0, scaleX: 0, filter: BLUR(10) },
                  { opacity: 1, scaleX: 1, filter: BLUR(0), duration: 0.2, ease: "expo.out", stagger }, t);
      }

      // ---------- бегущие субтитры ----------
      const caps = document.getElementById("caps");
      window.CAPTIONS.forEach((c) => {
        const el = document.createElement("div");
        el.className = "cap" + (c.accent ? " accent" : "");
        el.textContent = c.text;
        caps.appendChild(el);
        // вход не длиннее самой вспышки: уход, сработавший посреди входа, в покадровом рендере
        // проигрывает недоигравшему fromTo — и слово висит до конца ролика
        tl.fromTo(el, { opacity: 0, y: 12, scale: 0.92, filter: BLUR(4) },
                  { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: Math.min(0.09, c.t1 - c.t0), ease: "power2.out" }, c.t0);
        tl.set(el, { opacity: 0 }, c.t1);
      });


      // ---------- хук: почему корень — корень, при чём тут растение ----------
      tl.set("#b-root", { opacity: 1 }, 0.69);
      draw("#b-root-p", 0.69, 0.45);
      flash(0.69);
      leave("#b-root", 1.87, { y: -60 });
      tl.set("#sprout", { opacity: 1 }, 3.13);
      draw("#sp-stem", 3.13, 0.5);
      tl.fromTo(["#sp-leaf1", "#sp-leaf2"], { opacity: 0, scale: 0.3, svgOrigin: "200 140" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.12 }, 3.67);
      tl.fromTo("#sprout .sp-root", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", stagger: 0.08 }, 4.19);
      leave("#sprout", 4.97, { y: 80 });
      enter("#st-smoke", 8.37, { fromScale: 0.6, rot: -4 });
      leave("#st-smoke", 9.07, { y: -30, rot: -10 });

      // ---------- квадрат — настоящая фигура: 9 = 3 × 3 ----------
      tl.set("#sq", { opacity: 1 }, 9.41);
      draw("#sq-out", 9.41, 0.5);
      tl.to("#sq .cell", { opacity: 1, duration: 0.1, stagger: 0.07 }, 12.93);
      tl.to("#sq-9", { opacity: 1, duration: 0.15 }, 13.77);
      tl.to("#sq-3b", { opacity: 1, duration: 0.12 }, 14.93);
      tl.to("#sq-3l", { opacity: 1, duration: 0.12 }, 15.55);
      tl.to("#sq-side", { opacity: 1, duration: 0.15 }, 16.17);
      // квадрат «растёт» из своей стороны
      tl.to("#sq-grid", { scaleY: 0.04, svgOrigin: "300 420", duration: 0.3, ease: "power2.in" }, 17.99);
      tl.to("#sq-grid", { scaleY: 1, svgOrigin: "300 420", duration: 0.6, ease: "back.out(1.4)" }, 18.59);
      tl.fromTo("#sq .sq-root", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", stagger: 0.1 }, 19.93);
      slam("#b-koren", 21.45, { fromScale: 1.5 });
      flash(21.45);
      leave("#b-koren", 22.07, { y: -60 });
      leave("#sq", 22.17, { y: 80 });

      // ---------- мула → джизр → radix ----------
      enter("#ch-lead", 23.25, { fromScale: 0.9, dur: 0.25 });
      slam("#ch-1", 23.69, { fromScale: 1.4 });
      slam("#ch-2", 26.43, { fromScale: 1.4 });
      slam("#ch-3", 27.95, { fromScale: 1.4 });
      leave(["#ch-1", "#ch-2", "#ch-3", "#ch-lead"], 28.87, { y: -60 });

      // ---------- знак — с XVI века, это маленькая r от radix ----------
      enter("#b-xvi-lead", 29.17, { fromScale: 0.9, dur: 0.25 });
      slam("#b-xvi", 29.91, { fromScale: 1.5 });
      leave(["#b-xvi", "#b-xvi-lead"], 30.97, { y: -60 });
      enter("#r2r", 31.47, { fromY: 120, fromScale: 0.92, dur: 0.35, ease: "power3.out" });
      tl.fromTo("#rr-r", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 32.35);
      tl.to("#rr-arrow", { opacity: 1, duration: 0.15 }, 32.61);
      tl.fromTo("#rr-root", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 32.77);
      tl.to("#rr-word", { opacity: 1, duration: 0.2 }, 33.97);
      leave("#r2r", 34.52, { y: 80 });

      // ---------- черту придумал Декарт: видно, из чего извлекается ----------
      tl.set("#rad", { opacity: 1 }, 34.9);
      tl.fromTo("#rad", { y: 120, scale: 0.92 }, { y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 34.9);
      draw("#rad-v", 35.06, 0.35);
      draw("#rad-bar", 35.64, 0.35);
      card("#card-desc", 36.48, 41.9, "left");
      enter("#st-wall", 37.42, { fromScale: 0.6, rot: 4 });
      leave("#st-wall", 39.4, { y: -30, rot: 10 });
      tl.fromTo("#rad-x", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 39.8);
      tl.to("#rad-x", { fill: "#F5B82E", duration: 0.2 }, 41.46);
      leave("#rad", 42.5, { y: 80 });

      // ---------- радикал — от того же radix ----------
      slam("#b-rad", 44.6, { fromScale: 1.5 });
      leave("#b-rad", 45.9, { y: -60 });
      enter("#st-msk", 48.58, { fromScale: 0.6, rot: -4 });
      leave("#st-msk", 50.1, { y: -30, rot: -10 });

      tl.fromTo("#cta", { opacity: 0, y: 300, filter: BLUR(12) }, { opacity: 1, y: 0, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, 50.52);
      tl.set("#cta-arrow", { opacity: 1 }, 50.87);
      draw("#arrow-path", 50.87, 0.35);
      tl.fromTo("#arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 51.19);
      tl.to("#cta", { scale: 1.03, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 51.52);


      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
