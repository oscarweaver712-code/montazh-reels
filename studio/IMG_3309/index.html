      <audio id="sfx-a4" src="assets/sfx/impact-bass-1.mp3" data-start="1.64" data-volume="0.40"></audio>

      <audio id="sfx-l3" src="assets/sfx/click-soft.mp3" data-start="39.80" data-volume="0.36"></audio>

      <audio id="sfx-free" src="assets/sfx/notification.mp3" data-start="51.58" data-volume="0.24"></audio>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = window.CAMERA, step = 1 / window.CAMERA_FPS;
      tl.set(".cam", { transformOrigin: "0 0", x: cam[0][0], y: cam[0][1], scale: cam[0][2] }, 0);
      tl.to(".cam", {
        keyframes: cam.slice(1).map(([x, y, s]) => ({ x, y, scale: s, duration: step, ease: "none" })),
      }, 0);
      [[1.56, 3.05], [12.54, 14.10], [23.54, 25.05], [44.50, 46.00]]
        .forEach(([a, b]) => { tl.set("#cam-fg", { opacity: 1 }, a); tl.set("#cam-fg", { opacity: 0 }, b); });

      // ---------- словарь движения: всё входит И выходит движением, а не растворением ----------
      const BLUR = (px) => `blur(${px}px)`;

      // влёт со смазом: элемент прилетает размытым и встаёт в фокус
      function enter(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 0.7, x: o.fromX ?? 0, y: o.fromY ?? 0, filter: BLUR(o.blur ?? 12) };
        const to = { opacity: 1, scale: 1, x: 0, y: 0, filter: BLUR(0), duration: o.dur ?? 0.32, ease: o.ease ?? "back.out(1.7)" };
        if (o.rot !== undefined || o.fromRot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot ?? 0; }
        tl.fromTo(sel, from, to, t);
      }
      // уход: улетает, сжимается и смазывается
      function leave(sel, t, o = {}) {
        const to = { opacity: 0, scale: o.scale ?? 0.82, x: o.x ?? 0, y: o.y ?? -40, filter: BLUR(o.blur ?? 12),
                     duration: o.dur ?? 0.24, ease: o.ease ?? "power2.in" };
        if (o.rot !== undefined) to.rotation = o.rot;
        tl.to(sel, to, t);
      }
      // «впечатывание»: крупное слово или штамп бьёт в кадр с размаха
      function slam(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 1.45, filter: BLUR(o.blur ?? 16) };
        const to = { opacity: 1, scale: 1, filter: BLUR(0), duration: o.dur ?? 0.16, ease: "power4.out" };
        if (o.rot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot; }
        tl.fromTo(sel, from, to, t);
      }
      function draw(sel, t, dur = 0.4) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      }
      // портрет: вылет сбоку с поворотом, медленный наезд внутри картинки, улёт обратно
      function card(sel, tIn, tOut, side) {
        const s = side === "right" ? 1 : -1;
        tl.fromTo(sel, { opacity: 0, x: 460 * s, rotation: 16 * s, filter: BLUR(14) },
                  { opacity: 1, x: 0, rotation: 4 * s, filter: BLUR(0), duration: 0.45, ease: "power3.out" }, tIn);
        tl.fromTo(`${sel} img`, { scale: 1 }, { scale: 1.12, duration: tOut - tIn + 0.3, ease: "none" }, tIn);
        tl.to(sel, { opacity: 0, x: 460 * s, rotation: 18 * s, filter: BLUR(14), duration: 0.32, ease: "power2.in" }, tOut);
      }
      // документ снизу: выезжает с поворотом и уезжает вниз
      function doc(sel, tIn, tOut, o = {}) {
        tl.fromTo(sel, { opacity: 0, y: 560, rotation: o.fromRot ?? 7, filter: BLUR(12) },
                  { opacity: 1, y: 0, rotation: o.rot ?? -2, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, tIn);
        if (tOut !== null) {
          tl.to(sel, { opacity: 0, y: 520, rotation: (o.rot ?? -2) - 8, filter: BLUR(12), duration: 0.32, ease: "power2.in" }, tOut);
        }
      }
      // белая вспышка на главном ударе
      let flashes = 0;
      function flash(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.38, duration: 0.04, ease: "none", immediateRender: flashes++ === 0 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, t + 0.04);
      }
      function bars(sel, t, stagger = 0.06) {
        tl.fromTo(sel, { opacity: 0, scaleX: 0, filter: BLUR(10) },
                  { opacity: 1, scaleX: 1, filter: BLUR(0), duration: 0.2, ease: "expo.out", stagger }, t);
      }

      // ---------- бегущие субтитры ----------
      const caps = document.getElementById("caps");
      window.CAPTIONS.forEach((c) => {
        const el = document.createElement("div");
        el.className = "cap" + (c.accent ? " accent" : "");
        el.textContent = c.text;
        caps.appendChild(el);
        // вход не длиннее самой вспышки: уход, сработавший посреди входа, в покадровом рендере
        // проигрывает недоигравшему fromTo — и слово висит до конца ролика
        tl.fromTo(el, { opacity: 0, y: 12, scale: 0.92, filter: BLUR(4) },
                  { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: Math.min(0.09, c.t1 - c.t0), ease: "power2.out" }, c.t0);
        tl.set(el, { opacity: 0 }, c.t1);
      });


      // ---------- хук: почему А4 — 210 на 297 ----------
      slam("#a4", 1.66, { fromScale: 1.6 });
      flash(1.66);
      leave("#a4", 2.7, { y: -60 });
      enter("#sheet", 2.18, { fromY: 120, fromScale: 0.85, rot: -4, dur: 0.4, ease: "power3.out" });
      tl.to("#sz-w", { opacity: 1, duration: 0.12 }, 2.78);
      tl.to("#sz-h", { opacity: 1, duration: 0.12 }, 3.54);
      tl.to("#sz-w", { opacity: 0, duration: 0.1 }, 6.0);
      tl.to("#sz-w2", { opacity: 1, duration: 0.12 }, 6.04);
      tl.to("#sz-h", { opacity: 0, duration: 0.1 }, 6.9);
      tl.to("#sz-h2", { opacity: 1, duration: 0.12 }, 6.94);
      leave("#sheet", 8.15, { y: 80, rot: 6 });

      // ---------- 297 : 210 = √2 ----------
      enter("#div", 10.02, { fromY: 120, fromScale: 0.92, dur: 0.35, ease: "power3.out" });
      enter("#dv-a", 10.38, { fromScale: 1.4, dur: 0.15, blur: 6 });
      enter("#dv-b", 11.46, { fromScale: 1.4, dur: 0.15, blur: 6 });
      enter("#dv-c", 12.2, { fromScale: 1.4, dur: 0.15, blur: 6 });
      slam("#sqrt2", 12.64, { fromScale: 1.6 });
      flash(12.64);
      leave("#sqrt2", 13.75, { y: -60 });
      leave("#div", 14.0, { y: 80 });
      slam("#st-uniq", 15.5, { fromScale: 2.2, rot: -5, blur: 10 });
      leave("#st-uniq", 16.65, { scale: 0.6, y: 0, rot: -16 });

      // ---------- сложить пополам — та же форма ----------
      enter("#fold", 16.86, { fromY: 120, fromScale: 0.9, dur: 0.35, ease: "power3.out" });
      draw("#fold-line", 17.46, 0.3);
      tl.to("#fold-line", { opacity: 0, duration: 0.1 }, 18.25);
      tl.fromTo("#flap", { scaleY: 1 }, { scaleY: -1, svgOrigin: "300 238", duration: 0.5, ease: "power2.inOut", immediateRender: false }, 17.8);
      tl.to("#ghost", { opacity: 0.55, duration: 0.25 }, 18.35);
      tl.fromTo("#half", { rotation: 0, y: 0 }, { rotation: 90, y: -99, svgOrigin: "300 337", duration: 0.5, ease: "power3.inOut", immediateRender: false }, 18.8);
      tl.to("#same", { opacity: 1, duration: 0.2 }, 20.66);
      slam("#eq-half", 23.64, { fromScale: 1.4 });
      leave("#eq-half", 24.7, { y: -60 });
      leave("#fold", 25.6, { y: 80 });
      slam("#st-none", 27.0, { fromScale: 2.2, rot: 6, blur: 10 });
      leave("#st-none", 27.8, { scale: 0.6, y: 0, rot: 18 });

      // ---------- как матрёшка; русские снова впереди ----------
      enter("#matr", 28.84, { fromY: 140, fromScale: 0.7, dur: 0.4, ease: "back.out(1.6)" });
      leave("#matr", 29.9, { y: 80 });
      enter("#ru", 30.46, { fromScale: 0.6, rot: -4 });
      leave("#ru", 31.1, { y: -30, rot: -10 });

      // ---------- А0 = 1 м², дальше каждый раз пополам ----------
      enter("#iso", 31.16, { fromY: 120, fromScale: 0.9, dur: 0.4, ease: "power3.out" });
      enter("#lb0", 32.34, { fromScale: 1.4, dur: 0.18 });
      enter("#lb-m2", 34.44, { fromScale: 1.4, dur: 0.18 });
      leave(["#lb0", "#lb-m2"], 36.0, { y: 0, scale: 0.6, dur: 0.15 });
      draw("#l1", 36.12, 0.3);
      enter("#lb1", 36.92, { fromScale: 1.4, dur: 0.18 });
      draw("#l2", 38.36, 0.3);
      enter("#lb2", 38.92, { fromScale: 1.4, dur: 0.18 });
      draw("#l3", 39.82, 0.2);
      enter("#lb3", 40.0, { fromScale: 1.4, dur: 0.15 });
      draw("#l4", 40.34, 0.2);
      enter("#lb4", 40.5, { fromScale: 1.4, dur: 0.15 });
      tl.to("#a4-cell", { opacity: 0.45, duration: 0.2 }, 40.5);
      draw("#l5", 40.9, 0.2);
      enter("#lb5", 41.06, { fromScale: 1.4, dur: 0.15 });
      leave("#iso", 42.1, { y: 80 });

      // ---------- затрёхсотить три экзамена ----------
      slam("#b300", 44.6, { fromScale: 1.6 });
      flash(44.6);
      enter("#lead300", 45.12, { fromScale: 0.9, dur: 0.25 });
      leave(["#b300", "#lead300"], 45.65, { y: -60 });

      // ---------- комментарий «300» ----------
      leave(["#cta", "#cta-arrow"], 49.4, { y: 80 });
      enter("#p-comm", 49.56, { fromScale: 0.85, dur: 0.25 });
      enter("#comment", 49.62, { fromY: 160, fromScale: 0.9, dur: 0.4, ease: "power3.out" });
      tl.to("#cm-ph", { opacity: 0, duration: 0.05 }, 50.56);
      tl.to("#cm-3", { opacity: 1, duration: 0.03 }, 50.58);
      tl.to("#cm-0a", { opacity: 1, duration: 0.03 }, 50.66);
      tl.to("#cm-0b", { opacity: 1, duration: 0.03 }, 50.74);
      enter("#free", 51.6, { fromScale: 0.6, rot: -3 });

      tl.fromTo("#cta", { opacity: 0, y: 300, filter: BLUR(12) }, { opacity: 1, y: 0, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, 45.72);
      tl.set("#cta-arrow", { opacity: 1 }, 46.07);
      draw("#arrow-path", 46.07, 0.35);
      tl.fromTo("#arrow-head", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 46.39);
      tl.to("#cta", { scale: 1.03, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 46.72);


      window.__timelines["main"] = tl;
    </script>
