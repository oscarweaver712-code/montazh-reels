    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = window.CAMERA, step = 1 / window.CAMERA_FPS;
      tl.set(".cam", { transformOrigin: "0 0", x: cam[0][0], y: cam[0][1], scale: cam[0][2] }, 0);
      tl.to(".cam", {
        keyframes: cam.slice(1).map(([x, y, s]) => ({ x, y, scale: s, duration: step, ease: "none" })),
      }, 0);
      [[0.95, 2.95], [46.13, 47.93]]
        .forEach(([a, b]) => { tl.set("#cam-fg", { opacity: 1 }, a); tl.set("#cam-fg", { opacity: 0 }, b); });

      // ---------- словарь движения: всё входит И выходит движением, а не растворением ----------
      const BLUR = (px) => `blur(${px}px)`;

      // влёт со смазом: элемент прилетает размытым и встаёт в фокус
      function enter(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 0.7, x: o.fromX ?? 0, y: o.fromY ?? 0, filter: BLUR(o.blur ?? 12) };
        const to = { opacity: 1, scale: 1, x: 0, y: 0, filter: BLUR(0), duration: o.dur ?? 0.32, ease: o.ease ?? "back.out(1.7)" };
        if (o.rot !== undefined || o.fromRot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot ?? 0; }
        tl.fromTo(sel, from, to, t);
      }
      // уход: улетает, сжимается и смазывается
      function leave(sel, t, o = {}) {
        const to = { opacity: 0, scale: o.scale ?? 0.82, x: o.x ?? 0, y: o.y ?? -40, filter: BLUR(o.blur ?? 12),
                     duration: o.dur ?? 0.24, ease: o.ease ?? "power2.in" };
        if (o.rot !== undefined) to.rotation = o.rot;
        tl.to(sel, to, t);
      }
      // «впечатывание»: крупное слово или штамп бьёт в кадр с размаха
      function slam(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 1.45, filter: BLUR(o.blur ?? 16) };
        const to = { opacity: 1, scale: 1, filter: BLUR(0), duration: o.dur ?? 0.16, ease: "power4.out" };
        if (o.rot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot; }
        tl.fromTo(sel, from, to, t);
      }
      function draw(sel, t, dur = 0.4) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      }
      // портрет: вылет сбоку с поворотом, медленный наезд внутри картинки, улёт обратно
      function card(sel, tIn, tOut, side) {
        const s = side === "right" ? 1 : -1;
        tl.fromTo(sel, { opacity: 0, x: 460 * s, rotation: 16 * s, filter: BLUR(14) },
                  { opacity: 1, x: 0, rotation: 4 * s, filter: BLUR(0), duration: 0.45, ease: "power3.out" }, tIn);
        tl.fromTo(`${sel} img`, { scale: 1 }, { scale: 1.12, duration: tOut - tIn + 0.3, ease: "none" }, tIn);
        tl.to(sel, { opacity: 0, x: 460 * s, rotation: 18 * s, filter: BLUR(14), duration: 0.32, ease: "power2.in" }, tOut);
      }
      // документ снизу: выезжает с поворотом и уезжает вниз
      function doc(sel, tIn, tOut, o = {}) {
        tl.fromTo(sel, { opacity: 0, y: 560, rotation: o.fromRot ?? 7, filter: BLUR(12) },
                  { opacity: 1, y: 0, rotation: o.rot ?? -2, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, tIn);
        if (tOut !== null) {
          tl.to(sel, { opacity: 0, y: 520, rotation: (o.rot ?? -2) - 8, filter: BLUR(12), duration: 0.32, ease: "power2.in" }, tOut);
        }
      }
      // белая вспышка на главном ударе
      let flashes = 0;
      function flash(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.38, duration: 0.04, ease: "none", immediateRender: flashes++ === 0 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, t + 0.04);
      }
      // склейка (Валера 15.10: «склейки не спрятаны за переходами вспышками»): кадр приходит смазанным
      // и наводится за 5 кадров, поверх — вспышка в 3 кадра; крупность бьёт наезд Take.splice_punches.
      // Надписи через склейку не висят — уходят до неё, новая влетает на ней (verify_page).
      function splice(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.033, ease: "none", immediateRender: flashes++ === 0 }, t - 0.033);
        tl.to("#flash", { opacity: 0, duration: 0.16, ease: "power1.out" }, t);
        tl.fromTo(".cam", { filter: BLUR(16) }, { filter: BLUR(0), duration: 0.17, ease: "power2.out", immediateRender: false }, t);
      }
      // смена плана как у риелтора (15.10): кадр перескакивает крупнее с коротким смазом, без вспышки
      function whip(t) {
        tl.fromTo(".cam", { filter: BLUR(9) }, { filter: BLUR(0), duration: 0.12, ease: "power2.out", immediateRender: false }, t);
      }
      function bars(sel, t, stagger = 0.06) {
        tl.fromTo(sel, { opacity: 0, scaleX: 0, filter: BLUR(10) },
                  { opacity: 1, scaleX: 1, filter: BLUR(0), duration: 0.2, ease: "expo.out", stagger }, t);
      }

      // ---------- бегущие субтитры ----------
      const caps = document.getElementById("caps");
      window.CAPTIONS.forEach((c) => {
        const el = document.createElement("div");
        el.className = "cap" + (c.accent ? " accent" : "");
        el.textContent = c.text;
        if (c.y !== undefined) el.style.top = c.y + "px";
        caps.appendChild(el);
        // вход не длиннее самой вспышки: уход, сработавший посреди входа, в покадровом рендере
        // проигрывает недоигравшему fromTo — и слово висит до конца ролика
        tl.fromTo(el, { opacity: 0, y: 12, scale: 0.92, filter: BLUR(4) },
                  { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: Math.min(0.09, c.t1 - c.t0), ease: "power2.out" }, c.t0);
        tl.set(el, { opacity: 0 }, c.t1);
      });


      // ---------- хук: «цифры на самом деле УЗБЕКСКИЕ» за головой ----------
      slam("#h-uz", 1.94, { fromScale: 1.5 });
      flash(1.94);
      leave("#h-uz", 2.70, { y: -60, dur: 0.2 });

      // ---------- 1 2 3 4 5 под счёт пальцев, «АРАБСКИЕ» → зачёркнуто на «не арабы» ----------
      tl.set("#d15", { opacity: 1 }, 4.66);
      tl.fromTo("#d15-0", { opacity: 0, y: 70, scale: 0.6, filter: BLUR(10) }, { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: 0.14, ease: "back.out(2)", immediateRender: false }, 4.70);
      tl.fromTo("#d15-1", { opacity: 0, y: 70, scale: 0.6, filter: BLUR(10) }, { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: 0.14, ease: "back.out(2)", immediateRender: false }, 5.10);
      tl.fromTo("#d15-2", { opacity: 0, y: 70, scale: 0.6, filter: BLUR(10) }, { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: 0.14, ease: "back.out(2)", immediateRender: false }, 5.28);
      tl.fromTo("#d15-3", { opacity: 0, y: 70, scale: 0.6, filter: BLUR(10) }, { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: 0.14, ease: "back.out(2)", immediateRender: false }, 5.44);
      tl.fromTo("#d15-4", { opacity: 0, y: 70, scale: 0.6, filter: BLUR(10) }, { opacity: 1, y: 0, scale: 1, filter: BLUR(0), duration: 0.14, ease: "back.out(2)", immediateRender: false }, 5.58);

      slam("#d15-lbl", 6.26, { fromScale: 1.3, blur: 8 });
      draw("#d15-x", 10.30, 0.22);
      leave("#d15", 10.85, { y: -20 });
      leave("#d15-lbl", 10.85, { y: -20 });

      // ---------- ИИ-видео: Индия — «цифры от 0 до 9 придумали в Индии» ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.033, ease: "none", immediateRender: false }, 10.967);
      tl.to("#flash", { opacity: 0, duration: 0.16, ease: "power1.out" }, 11.000);
      tl.set("#ft-india", { opacity: 1 }, 11.000);
      tl.fromTo("#ft-india", { scale: 1.12, filter: BLUR(16) }, { scale: 1, filter: BLUR(0), duration: 0.22, ease: "power2.out", immediateRender: false }, 11.000);
      tl.fromTo("#ft-india-clip", { scale: 1 }, { scale: 1.08, duration: 2.45, ease: "none", immediateRender: false }, 11.000);
      tl.to("#ft-india", { scale: 1.06, filter: BLUR(14), duration: 0.12, ease: "power2.in" }, 13.330);
      tl.set("#ft-india", { opacity: 0, scale: 1, filter: BLUR(0) }, 13.450);
      splice(13.450);

      // ---------- Аль-Хорезми: марка СССР во весь кадр, книга, «вебинар» ----------
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.033, ease: "none", immediateRender: false }, 14.207);
      tl.to("#flash", { opacity: 0, duration: 0.16, ease: "power1.out" }, 14.240);
      tl.set("#sl-khw", { opacity: 1 }, 14.240);
      tl.fromTo("#sl-khw", { scale: 1.12, filter: BLUR(16) }, { scale: 1, filter: BLUR(0), duration: 0.22, ease: "power2.out", immediateRender: false }, 14.240);
      tl.set("#sl-khw-0", { opacity: 1 }, 14.240);
      tl.fromTo("#sl-khw-0", { scale: 1 }, { scale: 1.12, duration: 2.16, ease: "none", immediateRender: false }, 14.240);
      tl.to("#sl-khw", { scale: 1.06, filter: BLUR(14), duration: 0.12, ease: "power2.in" }, 16.280);
      tl.set("#sl-khw", { opacity: 0, scale: 1, filter: BLUR(0) }, 16.400);
      splice(16.400);
      enter("#book", 16.46, { fromY: 60, fromScale: 0.9, dur: 0.3, ease: "power3.out" });
      leave("#book", 19.10, { y: -20 });
      slam("#st-web", 19.36, { fromScale: 2.0, blur: 10, rot: -6 });
      leave("#st-web", 19.98, { scale: 0.8, y: 0, dur: 0.18 });

      // ---------- путь книги: Индия → Багдад → латынь XII века ----------
      tl.set("#rt", { opacity: 1 }, 20.04);
      tl.fromTo("#rt-n0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 20.04);
      draw("#rt-l1", 20.30, 0.35);
      tl.fromTo("#rt-n1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 20.62);
      draw("#rt-l2", 21.14, 0.4);
      tl.fromTo("#rt-n2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 21.55);
      tl.fromTo("#rt-lat", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 21.80);
      leave("#rt", 22.60, { y: -20 });

      // ---------- «нормальные цифры, а не только римские»: 2026 = MMXXVI ----------
      slam("#yr", 22.76, { fromScale: 1.3, blur: 8 });
      slam("#yr-rom", 24.58, { fromScale: 1.5, blur: 8 });
