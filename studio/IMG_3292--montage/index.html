      /* «Чертёж» (scripts/blueprint.py, 19.10.2026): кремовые линии, красный акцент, подписи Manrope */
      /* толщина и кегли — под экран телефона (19.10.2026: «почему такая маленькая»): 3,5 px линии и 30 px подписи
         читались как тонкий технический чертёж, рядом со словом за головой в 150 px — мелко */
      .bp-svg { position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }
      .bp-ln { fill: none; stroke: #F2EBDD; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

      .bp-ln.thin { stroke-width: 3; stroke: rgba(242,235,221,0.6); }
      .bp-dot { fill: #F2EBDD; opacity: 0; }
      .bp-dot.red { fill: #F0352C; }
      .bp-fill { fill: #F0352C; opacity: 0; }
      .bp-lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; opacity: 0; text-align: center;
                font-family: "Manrope"; font-weight: 800; font-size: 40px; letter-spacing: 0.12em; text-transform: uppercase;
                color: #F2EBDD; text-shadow: 0 2px 10px rgba(0,0,0,0.65); }
      .bp-lbl.red { color: #F0352C; }
      /* у края кадра подпись выравнивается внутрь: left или right от точки, по вертикали — середина (GSAP читает
         только translate −50% как xPercent, поэтому сдвиг по x — не transform) */
      .bp-lbl.al, .bp-lbl.ar { transform: translate(0, -50%); }
      .bp-lbl.al { text-align: left; }
      .bp-lbl.ar { text-align: right; }
      [data-safe] .bp-lbl { background: rgba(20,18,16,0.78); padding: 4px 14px 6px; border-radius: 4px; }
      .bp-lbl.big { font-family: "Oswald"; font-weight: 700; font-size: 80px; letter-spacing: 0.02em; line-height: 1; }
      .bp-lbl .sub { display: block; margin-top: 4px; font-family: "Cormorant"; font-style: italic; font-weight: 600;
                     font-size: 38px; letter-spacing: 0; text-transform: none; opacity: 0.9; }
      .bp-write { fill: rgba(242,235,221,0); stroke: #F2EBDD; stroke-width: 5; stroke-dasharray: 3000; stroke-dashoffset: 3000;
                  font-family: "Oswald"; font-weight: 700; paint-order: stroke; direction: ltr; unicode-bidi: bidi-override; }

      .bp-mark { fill: #F0352C; opacity: 0; }

      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
      #caps { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

    <script>

      const cam = window.CAMERA, step = 1 / window.CAMERA_FPS;
      tl.set(".cam", { transformOrigin: "0 0", x: cam[0][0], y: cam[0][1], scale: cam[0][2] }, 0);
      tl.to(".cam", {
        keyframes: cam.slice(1).map(([x, y, s]) => ({ x, y, scale: s, duration: step, ease: "none" })),
      }, 0);
      [[0.95, 2.95], [19.99, 23.80]]
        .forEach(([a, b]) => { tl.set("#cam-fg", { opacity: 1 }, a); tl.set("#cam-fg", { opacity: 0 }, b); });

      // ---------- словарь движения: всё входит И выходит движением, а не растворением ----------
      const BLUR = (px) => `blur(${px}px)`;

      // влёт со смазом: элемент прилетает размытым и встаёт в фокус
      function enter(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 0.7, x: o.fromX ?? 0, y: o.fromY ?? 0, filter: BLUR(o.blur ?? 12) };
        const to = { opacity: 1, scale: 1, x: 0, y: 0, filter: BLUR(0), duration: o.dur ?? 0.32, ease: o.ease ?? "back.out(1.7)" };
        if (o.rot !== undefined || o.fromRot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot ?? 0; }
        tl.fromTo(sel, from, to, t);
      }
      // уход: улетает, сжимается и смазывается
      function leave(sel, t, o = {}) {
        const to = { opacity: 0, scale: o.scale ?? 0.82, x: o.x ?? 0, y: o.y ?? -40, filter: BLUR(o.blur ?? 12),
                     duration: o.dur ?? 0.24, ease: o.ease ?? "power2.in" };
        if (o.rot !== undefined) to.rotation = o.rot;
        tl.to(sel, to, t);
      }
      // «впечатывание»: крупное слово или штамп бьёт в кадр с размаха
      function slam(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 1.45, filter: BLUR(o.blur ?? 16) };
        const to = { opacity: 1, scale: 1, filter: BLUR(0), duration: o.dur ?? 0.16, ease: "power4.out" };
        if (o.rot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot; }
        tl.fromTo(sel, from, to, t);
      }
      function draw(sel, t, dur = 0.4) {
        tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      }
      // портрет: вылет сбоку с поворотом, медленный наезд внутри картинки, улёт обратно
      function card(sel, tIn, tOut, side) {
        const s = side === "right" ? 1 : -1;
        tl.fromTo(sel, { opacity: 0, x: 460 * s, rotation: 16 * s, filter: BLUR(14) },
                  { opacity: 1, x: 0, rotation: 4 * s, filter: BLUR(0), duration: 0.45, ease: "power3.out" }, tIn);
        tl.fromTo(`${sel} img`, { scale: 1 }, { scale: 1.12, duration: tOut - tIn + 0.3, ease: "none" }, tIn);
        tl.to(sel, { opacity: 0, x: 460 * s, rotation: 18 * s, filter: BLUR(14), duration: 0.32, ease: "power2.in" }, tOut);
      }
      // документ снизу: выезжает с поворотом и уезжает вниз
      function doc(sel, tIn, tOut, o = {}) {
        tl.fromTo(sel, { opacity: 0, y: 560, rotation: o.fromRot ?? 7, filter: BLUR(12) },
                  { opacity: 1, y: 0, rotation: o.rot ?? -2, filter: BLUR(0), duration: 0.42, ease: "power3.out" }, tIn);
        if (tOut !== null) {
          tl.to(sel, { opacity: 0, y: 520, rotation: (o.rot ?? -2) - 8, filter: BLUR(12), duration: 0.32, ease: "power2.in" }, tOut);
        }
      }
      // белая вспышка на главном ударе
      let flashes = 0;
      function flash(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.38, duration: 0.04, ease: "none", immediateRender: flashes++ === 0 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, t + 0.04);
      }
      // склейка (Валера 15.10: «склейки не спрятаны за переходами вспышками»): кадр приходит смазанным
      // и наводится за 5 кадров, поверх — вспышка в 3 кадра; крупность бьёт наезд Take.splice_punches.
      // Надписи через склейку не висят — уходят до неё, новая влетает на ней (verify_page).
      function splice(t) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.033, ease: "none", immediateRender: flashes++ === 0 }, t - 0.033);
        tl.to("#flash", { opacity: 0, duration: 0.16, ease: "power1.out" }, t);

        tl.set(el, { opacity: 0 }, c.t1);

      tl.fromTo("#bp-way-p0", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)" }, 20.04);

      tl.fromTo("#bp-way-p1", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.5)" }, 20.76);
      enter("#bp-way-l1", 20.80, { fromY: 24, fromScale: 0.9, dur: 0.28 });
