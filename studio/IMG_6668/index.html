               background: linear-gradient(to bottom, rgba(10,12,8,0.55) 0%, rgba(10,12,8,0.32) 38%, rgba(10,12,8,0) 100%); }
      #cam-fg { opacity: 1; }   /* героиня поверх тени с первого кадра */
      .cam video, .ins video { filter: sepia(0.16) saturate(0.84) contrast(0.95) brightness(1.03); }
      /* вставка — полноэкранная вертикаль, склейка встык */
      .ins { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .ins video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* фоны за героиней: верх кадра — иллюстрация, к низу переход в родной кадр (стул, юбка) */
      .bg { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden;

      .bg img { position: absolute; left: -54px; top: -96px; width: 1188px; height: 2112px; filter: sepia(0.16) saturate(0.84) contrast(0.95) brightness(1.03); }
      /* низ и края кадра в тень: стык иллюстрации с родным садом уходит, героиня (вырезка) — поверх */
      #vig { left: 0; top: 0; width: 1080px; height: 1920px;
             background: radial-gradient(ellipse 75% 60% at 50% 46%, rgba(6,8,5,0) 55%, rgba(6,8,5,0.55) 100%),

      /* плёночное зерно поверх всего кадра; не графика (.g) — проверка лица его не считает */
      #grain { position: absolute; left: -256px; top: -256px; width: 1592px; height: 2432px; opacity: 0.075;
               background: url("assets/img/grain.png"); mix-blend-mode: overlay; pointer-events: none; }

    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = window.CAMERA, step = 1 / window.CAMERA_FPS;
      tl.set(".cam", { transformOrigin: "0 0", x: cam[0][0], y: cam[0][1], scale: cam[0][2] }, 0);
      tl.to(".cam", {
        keyframes: cam.slice(1).map(([x, y, s]) => ({ x, y, scale: s, duration: step, ease: "none" })),
      }, 0);
      [[0.00, 0.82], [2.34, 11.37]]
        .forEach(([a, b]) => { tl.set("#cam-fg", { opacity: 1 }, a); tl.set("#cam-fg", { opacity: 0 }, b); });

      // ---------- словарь движения: всё входит И выходит движением, а не растворением ----------
      const BLUR = (px) => `blur(${px}px)`;

      // влёт со смазом: элемент прилетает размытым и встаёт в фокус
      function enter(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 0.7, x: o.fromX ?? 0, y: o.fromY ?? 0, filter: BLUR(o.blur ?? 12) };
        const to = { opacity: 1, scale: 1, x: 0, y: 0, filter: BLUR(0), duration: o.dur ?? 0.32, ease: o.ease ?? "back.out(1.7)" };
        if (o.rot !== undefined || o.fromRot !== undefined) { from.rotation = o.fromRot ?? o.rot; to.rotation = o.rot ?? 0; }
        tl.fromTo(sel, from, to, t);
      }
      // уход: улетает, сжимается и смазывается
      function leave(sel, t, o = {}) {
        const to = { opacity: 0, scale: o.scale ?? 0.82, x: o.x ?? 0, y: o.y ?? -40, filter: BLUR(o.blur ?? 12),
                     duration: o.dur ?? 0.24, ease: o.ease ?? "power2.in" };
        if (o.rot !== undefined) to.rotation = o.rot;
        tl.to(sel, to, t);
      }
      // «впечатывание»: крупное слово или штамп бьёт в кадр с размаха
      function slam(sel, t, o = {}) {
        const from = { opacity: 0, scale: o.fromScale ?? 1.45, filter: BLUR(o.blur ?? 16) };
